name: UI test (client screenshots)

# Manual: makes a small world with the server, then starts the real game client (software rendering on a virtual
# screen), opens every Xeno Warriors screen and photographs each character, and publishes the screenshots.
on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'Only one gallery (e.g. sr), blank for everything'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  uitest:
    runs-on: ubuntu-latest
    env:
      XW_UITEST_EXTRA: ${{ (startsWith(github.event.inputs.focus, 'dmz') && 'dmz') || (github.event.inputs.focus == 'taczguard' && 'tacz') || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install virtual screen + software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
      - name: Make a world (server)
        env:
          XW_SELFTEST: "1"
          XW_SELFTEST_R: "1"
          XW_SELFTEST_VR: "0"
        run: |
          chmod +x gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=xenowarriors\nspawn-protection=0\nmax-tick-time=-1\n" > run/server.properties
          timeout 900 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          mkdir -p run/saves && cp -r run/world run/saves/uitest
          ls run/saves/uitest
      - name: Run the client
        env:
          XW_UITEST: "1"
          XW_UITEST_FOCUS: ${{ github.event.inputs.focus }}
          XW_UITEST_LODESTONE: ${{ github.event.inputs.focus == 'auras' && '1' || '0' }}
          XW_UITEST_HD: ${{ startsWith(github.event.inputs.focus, 'portraits') && '1' || '0' }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          SCREEN="1280x720x24"; if [ "$XW_UITEST_HD" = "1" ]; then SCREEN="1920x1080x24"; fi
          timeout 1500 xvfb-run -a -s "-screen 0 $SCREEN" ./gradlew runClient --no-daemon > client.log 2>&1 || true
          grep -E "XW-UITEST|ERROR|Exception|Caused by" client.log | head -80
          ls run/screenshots || true
      - name: Publish screenshots to the "uitest" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp client.log out/ || true
          tail -c 400000 server.log > out/server.log || true
          if ls run/screenshots/xw_anim_* >/dev/null 2>&1; then (cd run/screenshots && zip -q ../../out/anim.zip xw_anim_*.png && rm xw_anim_*.png); fi
          if ls run/screenshots/xw_allanim_* >/dev/null 2>&1; then (cd run/screenshots && zip -q ../../out/allanim.zip xw_allanim_*.png && rm xw_allanim_*.png); fi
          cp run/screenshots/*.png out/ 2>/dev/null || true
          TAG="uitest"; if [ -n "${{ github.event.inputs.focus }}" ]; then TAG="uitest-${{ github.event.inputs.focus }}"; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/* --title "UI test screenshots ($TAG)" --notes "Client UI test output" --prerelease
