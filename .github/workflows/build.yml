name: Build mod jar

# Runs every time code is pushed (or when you press "Run workflow" on the Actions tab).
# It builds the mod and puts the .jar on the repo's Releases page under "Latest build".
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Find the mod jar
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v sources | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenowarriors-mod
          path: ${{ steps.jar.outputs.path }}

      - name: Publish to the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build "${{ steps.jar.outputs.path }}" \
            --title "Latest build" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Drop the .jar into the mods folder of a Fabric 1.20.1 profile, together with Fabric API for 1.20.1." \
            --prerelease
