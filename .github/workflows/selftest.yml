name: Server self-test (Recarnet)

# Manual: starts a Forge server with the mod, generates Aurora City in Recarnet, saves, stops.
# Uploads the log and the Recarnet region files so the city can be rendered.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run server
        env:
          XW_SELFTEST: "1"
          XW_SELFTEST_R: "15"
        run: |
          chmod +x gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=xenowarriors\nspawn-protection=0\nmax-tick-time=-1\n" > run/server.properties
          timeout 1500 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          grep -E "XW-SELFTEST|ERROR|Exception|Caused by" server.log | head -80
      - name: Publish results to the "selftest" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp server.log out/ || true
          cp run/logs/latest.log out/latest.log || true
          (cd run/world/dimensions/xenowarriors/recarnet 2>/dev/null && zip -qr $GITHUB_WORKSPACE/out/recarnet-world.zip region entities) || true
          gh release delete selftest --yes --cleanup-tag || true
          gh release create selftest out/* --title "Self-test results" --notes "Recarnet server self-test output" --prerelease
          grep -q "XW-SELFTEST OK" server.log
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recarnet-world
          path: |
            server.log
            run/logs/latest.log
            run/world/dimensions/xenowarriors/recarnet/region/
            run/world/dimensions/xenowarriors/recarnet/entities/
