plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // UI test (CI): jump straight into the 'uitest' world
            if (System.getenv('XW_UITEST') == '1') { args '--quickPlaySingleplayer', 'uitest' }
            // HD shots (portraits): a 1920x1080 window
            if (System.getenv('XW_UITEST_HD') == '1') { args '--width', '1920', '--height', '1080' }
        }

        server {
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Other mods we build against are NOT kept in this repo (their licenses don't let us re-host them): on the first build
// each one is downloaded from its official source (Modrinth, or its author's maven) into libs/ (git-ignored).
def xwLibs = [
    [file: 'geckolib-forge-1.20.1-4.8.4.jar', modrinth: 'geckolib', match: '4.8.4',
     url: 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-forge-1.20.1/4.8.4/geckolib-forge-1.20.1-4.8.4.jar'],
    [file: 'mclib-20.jar', url: 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/com/eliotlash/mclib/mclib/20/mclib-20.jar'],
    [file: 'voicechat-api-2.6.24.jar', url: 'https://maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-api/2.6.24/voicechat-api-2.6.24.jar'],
    [file: 'epicfight-forge-1.20.1-20.14.17.jar', modrinth: 'epic-fight', match: '20.14.17'],
    [file: 'lodestone-1.20.1-1.6.4.1.257.jar', url: 'https://maven.blamejared.com/team/lodestar/lodestone/lodestone/1.20.1-1.6.4.1.257/lodestone-1.20.1-1.6.4.1.257.jar'],
]
def xwDownload = { String from, File to ->
    def c = new URL(from).openConnection()
    c.setRequestProperty('User-Agent', 'amenxl/xeno-warriors-mod build')
    c.instanceFollowRedirects = true
    to.withOutputStream { out -> c.inputStream.withStream { it.transferTo(out) } }
}
file('libs').mkdirs()
xwLibs.each { lib ->
    File f = file("libs/${lib.file}")
    if (f.exists() && f.length() > 0) return
    def errors = []
    if (lib.url) { try { xwDownload(lib.url, f) } catch (Exception e) { errors << "${lib.url}: $e"; f.delete() } }
    if (!f.exists() && lib.modrinth) {
        try {
            def api = "https://api.modrinth.com/v2/project/${lib.modrinth}/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D"
            def c = new URL(api).openConnection(); c.setRequestProperty('User-Agent', 'amenxl/xeno-warriors-mod build')
            def versions = new groovy.json.JsonSlurper().parse(c.inputStream)
            def v = versions.find { it.version_number.contains(lib.match) && !it.version_number.contains('neoforge') }
            if (v == null) throw new GradleException("no ${lib.modrinth} version matching ${lib.match}")
            def jar = v.files.find { it.primary } ?: v.files[0]
            xwDownload(jar.url, f)
        } catch (Exception e) { errors << "modrinth ${lib.modrinth}: $e"; f.delete() }
    }
    if (!f.exists()) throw new GradleException("Couldn't download ${lib.file}:\n  " + errors.join('\n  '))
    println "Downloaded ${lib.file}"
}

// UI tests only (XW_UITEST_EXTRA=dmz,tacz): other mods downloaded from Modrinth at test time, so their compatibility
// can be checked in CI. Nothing here is committed or shipped.
def xwExtra = []
def xwExtraEnv = System.getenv('XW_UITEST_EXTRA') ?: ''
if (xwExtraEnv.contains('dmz')) xwExtra += [[q: 'dragonminez', match: '2.1.3'], [q: 'terrablender', match: ''], [q: 'curios', match: '']]
if (xwExtraEnv.contains('tacz')) xwExtra += [[q: 'tacz', match: '']]
xwExtra.each { m ->
    File f = file("libs/xwextra-${m.q}-1.jar")
    m.coord = "blank:xwextra-${m.q}:1"
    if (f.exists() && f.length() > 0) return
    def ua = { String u -> def c = new URL(u).openConnection(); c.setRequestProperty('User-Agent', 'amenxl/xeno-warriors-mod test'); c }
    def facets = java.net.URLEncoder.encode('[["categories:forge"],["versions:1.20.1"]]', 'UTF-8')
    def hits = new groovy.json.JsonSlurper().parse(ua("https://api.modrinth.com/v2/search?query=${m.q}&facets=${facets}").inputStream).hits
    if (!hits) throw new GradleException("Modrinth: nothing found for ${m.q}")
    def slug = (hits.find { it.slug == m.q } ?: hits[0]).slug
    def versions = new groovy.json.JsonSlurper().parse(ua("https://api.modrinth.com/v2/project/${slug}/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D").inputStream)
    def v = versions.find { !m.match || it.version_number.contains(m.match) } ?: versions[0]
    def jar = v.files.find { it.primary } ?: v.files[0]
    println "UI test extra: ${slug} ${v.version_number} (${jar.filename})"
    xwDownload(jar.url, f)
}

repositories {
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // GeckoLib: keyframe animations for Mikiko (required); mclib is the math library it ships inside itself
    implementation fg.deobf("blank:geckolib-forge-1.20.1:4.8.4")
    compileOnly files('libs/mclib-20.jar')
    // Simple Voice Chat API (optional: mouths move while people talk)
    compileOnly files('libs/voicechat-api-2.6.24.jar')
    // Epic Fight (optional): Xeno Warriors details on its skinned player, and it hands back non-combat animation to us
    compileOnly fg.deobf("blank:epicfight-forge-1.20.1:20.14.17")
    compileOnly fg.deobf("blank:lodestone-1.20.1:1.6.4.1.257")      // optional: fancier effects when Lodestone is installed
    xwExtra.each { m -> runtimeOnly fg.deobf(m.coord) }
    if (xwExtraEnv.contains('ef')) runtimeOnly fg.deobf("blank:epicfight-forge-1.20.1:20.14.17")   // (Epic Fight animation tests in CI)
    if (System.getenv('XW_UITEST_LODESTONE') == '1') runtimeOnly fg.deobf("blank:lodestone-1.20.1:1.6.4.1.257")   // (aura screenshots in CI)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
